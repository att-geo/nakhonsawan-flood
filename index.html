<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nakhon Sawan Flood Watch</title>
<meta name="description" content="ติดตามพื้นที่น้ำท่วมขังและระยะเวลาท่วม จังหวัดนครสวรรค์ แบบ near-realtime">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3C11 11 7 16 7 21a9 9 0 0 0 18 0c0-5-4-10-9-18z' fill='%232563eb'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="app">
  <aside id="panel" aria-label="แผงข้อมูล">
    <header class="brand">
      <div class="brand-row">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><path d="M16 3C11 11 7 16 7 21a9 9 0 0 0 18 0c0-5-4-10-9-18z" fill="currentColor"/></svg>
        <div>
          <h1>Nakhon Sawan Flood Watch</h1>
          <p class="sub">ติดตามพื้นที่น้ำท่วมขัง จ.นครสวรรค์</p>
        </div>
        <button id="panelToggle" class="icon-btn" aria-label="ย่อ/ขยายแผง">☰</button>
      </div>
      <div class="updated"><span class="dot" id="liveDot"></span><span id="updated">กำลังโหลด…</span></div>
    </header>

    <section class="kpis" id="kpis"></section>

    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="district" class="active">อำเภอ</button>
      <button role="tab" data-tab="stations">ระดับน้ำ</button>
      <button role="tab" data-tab="rain">ฝน</button>
      <button role="tab" data-tab="windy">Windy</button>
      <button role="tab" data-tab="about">วิธีการ</button>
    </nav>
    <div class="tabbody">
      <section data-pane="district" class="pane active">
        <table class="tbl" id="distTable"><thead><tr><th>อำเภอ</th><th title="พื้นที่ท่วมขัง (≥25 ซม.) ตอนนี้">ตอนนี้<br><small>กม²</small></th><th title="คาดการณ์สูงสุดใน 72 ชม.">72 ชม.<br><small>กม²</small></th><th>ฝน 24 ชม.<br><small>มม.</small></th></tr></thead><tbody></tbody></table>
        <p class="note">คลิกชื่ออำเภอเพื่อซูมไปยังพื้นที่</p>
      </section>
      <section data-pane="stations" class="pane">
        <div id="wlList" class="list"></div>
      </section>
      <section data-pane="rain" class="pane">
        <h3>ฝนเฉลี่ยทั้งจังหวัด รายชั่วโมง</h3>
        <div id="rainChart" class="chart"></div>
        <p class="note" id="adjustNote"></p>
        <h3>สถานีวัดฝน 24 ชม. สูงสุด</h3>
        <div id="rainList" class="list"></div>
      </section>
      <section data-pane="windy" class="pane">
        <div class="seg" id="windySeg">
          <button data-ov="rain" class="active">ฝน/พายุ</button>
          <button data-ov="rainAccu">ฝนสะสม</button>
          <button data-ov="radar">เรดาร์</button>
          <button data-ov="clouds">เมฆ</button>
        </div>
        <div class="windy-wrap"><iframe id="windy" title="Windy" loading="lazy"></iframe></div>
        <p class="note">ภาพจาก Windy.com (ECMWF) — ใช้ประกอบการดูสภาพอากาศเท่านั้น</p>
      </section>
      <section data-pane="about" class="pane prose" id="about"></section>
    </div>
  </aside>

  <main id="mapWrap">
    <div id="map"></div>
    <div class="map-ctl" id="modeCtl">
      <label>แสดง
        <select id="mode">
          <option value="class">ระดับน้ำท่วมขัง</option>
          <option value="m72">สูงสุดใน 72 ชม. ข้างหน้า</option>
          <option value="dur">ระยะเวลาท่วม</option>
          <option value="p24">ฝน 24 ชม. ที่ผ่านมา</option>
          <option value="p7d">ฝน 7 วันที่ผ่านมา</option>
          <option value="f72">ฝนพยากรณ์ 72 ชม.</option>
        </select>
      </label>
    </div>
    <div class="legend" id="legend"></div>
    <div class="timeline" id="timeline">
      <button id="play" class="icon-btn" aria-label="เล่น">▶</button>
      <div class="tl-main">
        <input type="range" id="slider" min="0" max="0" value="0" aria-label="เวลา">
        <div class="tl-labels"><span id="tlStart"></span><span id="tlLabel" class="tl-now"></span><span id="tlEnd"></span></div>
      </div>
      <button id="nowBtn" class="chip">ตอนนี้</button>
    </div>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
