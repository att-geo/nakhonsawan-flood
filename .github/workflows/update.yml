name: update-flood-data

on:
  schedule:
    - cron: "7 * * * *"        # ทุกชั่วโมง นาทีที่ 7 (UTC) — GitHub อาจดีเลย์ 5–20 นาที
  workflow_dispatch:
    inputs:
      hotspots:
        description: "รันแบบจำลอง 2D จุดวิกฤตรอบนี้"
        type: boolean
        default: true
      calibrate:
        description: "สอบเทียบโมเดล hex กับผล 2D แล้ว commit calibration.json"
        type: boolean
        default: false
      s1:
        description: "แปลน้ำท่วมจาก Sentinel-1 รอบนี้ (ไม่ต้องใช้ GISTDA key)"
        type: boolean
        default: true
      province:
        description: "พยากรณ์ 2D ทั้งจังหวัด 72 ชม. รอบนี้ (~10 นาที)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install numpy

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Restore last good live data (fallback if sources fail)
        continue-on-error: true
        run: |
          base="${{ steps.pages.outputs.base_url }}"
          for f in meta status frames stations districts series upstream gauges_hist rain_cache gistda_obs s1_obs s1_status prov_state; do
            curl -sfL "$base/data/live/$f.json" -o "data/live/$f.json.prev" && mv "data/live/$f.json.prev" "data/live/$f.json" || true
          done
          curl -sfL "$base/data/live/gistda_flood.geojson" -o data/live/gistda_flood.geojson || true
          curl -sfL "$base/data/live/s1_flood.geojson" -o data/live/s1_flood.geojson.prev && mv data/live/s1_flood.geojson.prev data/live/s1_flood.geojson || true
          cp data/live/hotspots_live.json /tmp/hotspots_live.repo.json 2>/dev/null || true
          for f in hex_state hotspots_live; do
            curl -sfL "$base/data/live/$f.json" -o "data/live/$f.json.prev" && mv "data/live/$f.json.prev" "data/live/$f.json" || true
          done
          mkdir -p data/live/hotspots
          python - "$base" <<'PY' || true
          import json, sys, urllib.request, os
          base = sys.argv[1]; p = "data/live/hotspots_live.json"
          if os.path.exists(p):
              live = json.load(open(p, encoding="utf8"))
              # โดเมนที่มีใน repo แต่ยังไม่มีบน Pages (เช่น เพิ่งเพิ่มท่าตะโก) — เก็บผลที่ commit ไว้ ไม่ให้หายตอนกู้คืน
              repo = {}
              try:
                  repo = json.load(open("/tmp/hotspots_live.repo.json", encoding="utf8"))
                  for k, v in repo.items():
                      if not k.startswith("_") and k not in live: live[k] = v; print("keep repo domain", k)
                  json.dump(live, open(p, "w", encoding="utf8"), ensure_ascii=False)
              except Exception as e: print("no repo copy", e)
              for k, v in live.items():
                  if k.startswith("_"): continue
                  for fn in v.get("png", {}).values():
                      try: urllib.request.urlretrieve(f"{base}/data/live/hotspots/{fn}", f"data/live/hotspots/{fn}")
                      except Exception as e: print("skip", fn, e)
          PY

      - name: Run near-realtime model
        id: model
        continue-on-error: true
        env:
          GISTDA_API_KEY: ${{ secrets.GISTDA_API_KEY }}
        run: python pipeline/run_update.py --site .

      - name: Sentinel-1 flood extent (วันละ 2 ครั้ง หรือสั่งเอง — ไม่ต้องใช้ API key)
        continue-on-error: true
        timeout-minutes: 20
        run: |
          H=$(date -u +%H)
          if { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.s1 }}" = "true" ]; } || \
             { [ "${{ github.event_name }}" = "schedule" ] && { [ "$H" = "03" ] || [ "$H" = "15" ]; }; }; then
            pip install -q scipy rasterio pyproj pystac-client planetary-computer
            if [ -s data/live/s1_obs.json ] || [ -s data/static/s1_obs.json ]; then D=14; else D=45; fi
            python pipeline/s1_obs.py --site . --days $D
          else
            echo "skip Sentinel-1 this hour (ใช้ผลรอบก่อนที่กู้คืนมา)"
          fi

      - name: 2D hotspot model (ทุก 6 ชม. หรือสั่งเอง ; ระยะเวลาท่วมขังแอ่งท่าตะโก วันละครั้ง 00 UTC)
        if: steps.model.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 40
        run: |
          H=$(date -u +%H)
          if { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.hotspots }}" = "true" ]; } || \
             { [ "${{ github.event_name }}" = "schedule" ] && [ $((10#$H % 6)) -eq 0 ]; }; then
            LONG=""; [ "$H" = "00" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] && LONG="--long"
            python pipeline/run_hotspots.py --site . $LONG
          else
            echo "skip 2D this hour (ใช้ผลรอบก่อนที่กู้คืนมา)"
          fi

      - name: 2D ทั้งจังหวัด พยากรณ์ 72 ชม. (วันละ 4 ครั้ง 04/10/16/22 UTC หรือสั่งเอง ; ~10 นาที)
        if: steps.model.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 25
        run: |
          H=$(date -u +%H)
          if { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.province }}" = "true" ]; } || \
             { [ "${{ github.event_name }}" = "schedule" ] && { [ "$H" = "04" ] || [ "$H" = "10" ] || [ "$H" = "16" ] || [ "$H" = "22" ]; }; }; then
            pip install -q scipy
            python pipeline/run_province.py --site .
          else
            echo "skip province 2D this hour (ใช้ผลรอบก่อนที่กู้คืนมา)"
          fi

      - name: Calibrate hex model against 2D (สัปดาห์ละครั้ง หรือสั่งเอง)
        if: steps.model.outcome == 'success'
        continue-on-error: true
        run: |
          H=$(date -u +%H); D=$(date -u +%u)
          if { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.calibrate }}" = "true" ]; } || \
             { [ "${{ github.event_name }}" = "schedule" ] && [ "$D" = "7" ] && [ "$H" = "00" ]; }; then
            python pipeline/calibrate.py --site . && python pipeline/run_update.py --site .
            git config user.name "flood-bot"; git config user.email "flood-bot@users.noreply.github.com"
            cp data/live/gistda_obs.json data/static/gistda_obs.json 2>/dev/null || true
            cp data/live/s1_obs.json data/static/s1_obs.json 2>/dev/null || true
            git add data/static/calibration.json; git add data/static/gistda_obs.json data/static/s1_obs.json 2>/dev/null
            git commit -m "chore: recalibrate hex model [skip ci]" && git push || true
          fi

      - name: Keep schedule alive (GitHub ปิด cron ถ้า repo ไม่มี commit 60 วัน)
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50*24*3600 )) ]; then
            git config user.name "flood-bot"; git config user.email "flood-bot@users.noreply.github.com"
            date -u +%FT%TZ > .keepalive && git add .keepalive
            git commit -m "chore: keepalive [skip ci]" && git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
